name: Build VST3 Plugins

on:
  push:
    branches: [ main ]
    paths:
      - 'VC-*/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Plugins to build (comma-separated, e.g. "VC-EQ,VC-Comp" or "all")'
        required: false
        default: 'all'
      publish_release:
        description: 'Publish as GitHub Release? (enter tag e.g. v1.0.0, leave empty to skip)'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  JUCE_VERSION: '8.0.12'

jobs:
  # ──────────────────────────────────────
  # 阶段1: 检测哪些插件需要构建，生成矩阵JSON
  # ──────────────────────────────────────
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      should_build: ${{ steps.set.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed plugins
        id: set
        shell: bash
        run: |
          # 确定要构建的插件列表
          plugins=""
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            input="${{ github.event.inputs.plugins }}"
            if [[ "$input" == "all" ]]; then
              plugins=$(ls -d VC-*/ 2>/dev/null | sed 's/\/$//' | tr '\n' ' ' | xargs)
            else
              plugins=$(echo "$input" | tr ',' ' ' | xargs)
            fi
            echo "📋 Manual trigger: building $plugins"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            plugins=$(ls -d VC-*/ 2>/dev/null | sed 's/\/$//' | tr '\n' ' ' | xargs)
            echo "📋 PR trigger: building all"
          else
            # Push模式：检测变化的目录
            changed_files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            
            # 如果workflow文件变了，构建全部插件
            if echo "$changed_files" | grep -q ".github/workflows/"; then
              plugins=$(ls -d VC-*/ 2>/dev/null | sed 's/\/$//' | tr '\n' ' ' | xargs)
              echo "📋 Workflow changed: building all"
            else
              # 检测哪些VC-*目录有变化
              for dir in VC-*/; do
                plugin="${dir%/}"
                if echo "$changed_files" | grep -q "^${plugin}/"; then
                  plugins="$plugins $plugin"
                fi
              done
              plugins=$(echo $plugins | xargs)
              echo "📋 Changed plugins: ${plugins:-none}"
            fi
          fi

          if [[ -z "$plugins" ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "matrix={}" >> $GITHUB_OUTPUT
            echo "📋 No plugin changes detected, skipping build"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            # 生成矩阵JSON: {"plugin":["VC-EQ","VC-Comp"]}
            json_arr=$(echo $plugins | tr ' ' '\n' | sort -u | python3 -c "import sys,json; print(json.dumps({'plugin':[l.strip() for l in sys.stdin if l.strip()]}))")
            echo "matrix=$json_arr" >> $GITHUB_OUTPUT
            echo "📋 Matrix: $json_arr"
          fi

  # ──────────────────────────────────────
  # 阶段2: 每个插件 × 每个平台独立构建
  # ──────────────────────────────────────
  build:
    name: ${{ matrix.plugin }} (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.matrix).plugin }}
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            cmake_generator: "Ninja"
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
          - os: ubuntu-latest
            cmake_generator: "Ninja"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'MacOS'
        shell: bash
        run: brew install ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libdbus-1-dev pkg-config

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ runner.os }}-v${{ env.JUCE_VERSION }}

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git

      - name: Configure ${{ matrix.plugin }}
        shell: bash
        run: |
          mkdir -p ${{ matrix.plugin }}/build
          cd ${{ matrix.plugin }}/build
          cmake .. -G "${{ matrix.cmake_generator }}" -DJUCE_PATH=../../JUCE -DCMAKE_BUILD_TYPE=Release

      - name: Build ${{ matrix.plugin }}
        shell: bash
        run: |
          cd ${{ matrix.plugin }}/build
          cmake --build . --config Release

      - name: List artefacts
        if: always()
        shell: bash
        run: find ${{ matrix.plugin }}/build \( -name "*.vst3" -o -name "*.component" -o -name "*.dll" \) 2>/dev/null || echo "none found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.plugin }}-${{ matrix.os }}
          path: |
            ${{ matrix.plugin }}/build/${{ matrix.plugin }}_artefacts/
            ${{ matrix.plugin }}/build/**/${{ matrix.plugin }}.vst3/
          retention-days: 30

  # ──────────────────────────────────────
  # 阶段3: 汇总打包 + 发Release（仅手动触发且填写了tag时）
  # ──────────────────────────────────────
  release:
    name: Package & Release
    needs: [detect, build]
    if: needs.detect.outputs.should_build == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package by platform
        shell: bash
        run: |
          mkdir -p release

          # macOS
          mkdir -p macos-pkg
          for dir in artifacts/*-macos-latest; do
            [ -d "$dir" ] || continue
            find "$dir" \( -name "*.vst3" -o -name "*.component" \) -exec cp -r {} macos-pkg/ \;
          done
          if ls macos-pkg/*.vst3 2>/dev/null || ls macos-pkg/*.component 2>/dev/null; then
            cd macos-pkg && zip -r ../release/VocalChain-macOS.zip . && cd ..
          fi

          # Windows
          mkdir -p windows-pkg
          for dir in artifacts/*-windows-latest; do
            [ -d "$dir" ] || continue
            find "$dir" -name "*.vst3" -exec cp -r {} windows-pkg/ \;
          done
          if ls windows-pkg/*.vst3 2>/dev/null; then
            cd windows-pkg && zip -r ../release/VocalChain-Windows.zip . && cd ..
          fi

          # Linux
          mkdir -p linux-pkg
          for dir in artifacts/*-ubuntu-latest; do
            [ -d "$dir" ] || continue
            find "$dir" -name "*.vst3" -exec cp -r {} linux-pkg/ \;
          done
          if ls linux-pkg/*.vst3 2>/dev/null; then
            cd linux-pkg && zip -r ../release/VocalChain-Linux.zip . && cd ..
          fi

          echo "=== Packages ==="
          ls -lh release/

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.publish_release }}"
          gh release create "$TAG" release/*.zip \
            --repo "${{ github.repository }}" \
            --title "VocalChain $TAG" \
            --notes "VocalChain plugin suite $TAG

          ## Downloads
          - **VocalChain-macOS.zip** - All VST3 plugins for macOS (Apple Silicon + Intel)
          - **VocalChain-Windows.zip** - All VST3 plugins for Windows
          - **VocalChain-Linux.zip** - All VST3 plugins for Linux

          Built with JUCE ${{ env.JUCE_VERSION }}"
