name: Build VST3 Plugins

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmake_generator: "Xcode"
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
          - os: ubuntu-latest
            cmake_generator: "Unix Makefiles"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # macOS
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      # Linux - 只装核心依赖，不装webkit/gtk/curl（代码中已禁用）
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libdbus-1-dev \
            pkg-config

      # Windows runner 已预装 CMake + VS

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ runner.os }}-v8.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 8.0.0 https://github.com/juce-framework/JUCE.git

      # JUCE_PATH 是 CACHE 变量，-D 参数直接覆盖，无需 sed 修改源文件

      - name: Configure VC-EQ
        run: |
          mkdir -p VC-EQ/build
          cd VC-EQ/build
          cmake .. -G "${{ matrix.cmake_generator }}" -DJUCE_PATH=../../JUCE -DCMAKE_BUILD_TYPE=Release

      - name: Build VC-EQ
        run: |
          cd VC-EQ/build
          cmake --build . --config Release

      - name: Configure VC-Comp
        run: |
          mkdir -p VC-Comp/build
          cd VC-Comp/build
          cmake .. -G "${{ matrix.cmake_generator }}" -DJUCE_PATH=../../JUCE -DCMAKE_BUILD_TYPE=Release

      - name: Build VC-Comp
        run: |
          cd VC-Comp/build
          cmake --build . --config Release

      - name: Upload VC-EQ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VC-EQ-${{ matrix.os }}
          path: |
            VC-EQ/build/VC-EQ_artefacts/
            VC-EQ/build/**/*.vst3
            VC-EQ/build/**/*.component
          retention-days: 30

      - name: Upload VC-Comp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VC-Comp-${{ matrix.os }}
          path: |
            VC-Comp/build/VC-Comp_artefacts/
            VC-Comp/build/**/*.vst3
            VC-Comp/build/**/*.component
          retention-days: 30
