name: Build VST3 Plugins

on:
  push:
    branches: [ main, master ]
    paths:
      - 'VC-*/**'
      - '.github/workflows/**'
      - 'tests/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Plugins to build (comma-separated, e.g. "VC-EQ,VC-Comp" or "all")'
        required: false
        default: 'all'
      publish_release:
        description: 'Publish as GitHub Release? (enter tag e.g. v1.0.0, leave empty to skip)'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  JUCE_VERSION: '8.0.12'
  MACOSX_DEPLOYMENT_TARGET: '10.15'

jobs:
  # ──────────────────────────────────────
  # 阶段1: 检测哪些插件需要构建，生成矩阵JSON
  # ──────────────────────────────────────
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      should_build: ${{ steps.set.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed plugins
        id: set
        shell: bash
        run: |
          plugins=""
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            input="${{ github.event.inputs.plugins }}"
            if [[ "$input" == "all" ]]; then
              plugins=$(ls -d VC-*/ 2>/dev/null | grep -v "VC-Plugin-Template" | sed 's/\/$//' | tr '\n' ' ' | xargs)
            else
              plugins=$(echo "$input" | tr ',' ' ' | xargs)
            fi
            echo "Manual trigger: building $plugins"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            plugins=$(ls -d VC-*/ 2>/dev/null | grep -v "VC-Plugin-Template" | sed 's/\/$//' | tr '\n' ' ' | xargs)
            echo "PR trigger: building all"
          else
            changed_files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            if echo "$changed_files" | grep -q ".github/workflows/"; then
              plugins=$(ls -d VC-*/ 2>/dev/null | grep -v "VC-Plugin-Template" | sed 's/\/$//' | tr '\n' ' ' | xargs)
              echo "Workflow changed: building all"
            else
              for dir in VC-*/; do
                [[ "$dir" == "VC-Plugin-Template/" ]] && continue
                plugin="${dir%/}"
                if echo "$changed_files" | grep -q "^${plugin}/"; then
                  plugins="$plugins $plugin"
                fi
              done
              plugins=$(echo $plugins | xargs)
              echo "Changed plugins: ${plugins:-none}"
            fi
          fi

          if [[ -z "$plugins" ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "matrix={}" >> $GITHUB_OUTPUT
            echo "No plugin changes detected, skipping build"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            json_arr=$(echo $plugins | tr ' ' '\n' | sort -u | python3 -c "import sys,json; print(json.dumps({'plugin':[l.strip() for l in sys.stdin if l.strip()]}))")
            echo "matrix=$json_arr" >> $GITHUB_OUTPUT
            echo "Matrix: $json_arr"
          fi


  # ──────────────────────────────────────
  # 阶段1.5: Gen2插件快速编译验证（g++ standalone，无需JUCE）
  # ──────────────────────────────────────
  gen2-verify:
    name: Gen2 Compile Verify
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VC-Stereo (Standalone)
        shell: bash
        run: |
          cd VC-Stereo
          g++ -std=c++17 -DVC_STANDALONE -O2 -I../Libs/dr_wav \
            Source/CLI_Standalone/main.cpp Source/DSP/VCPluginDSP.cpp \
            -o VC-Stereo-CLI-Standalone -lm

      - name: Build VC-PitchShift (Standalone)
        shell: bash
        run: |
          cd VC-PitchShift
          g++ -std=c++17 -DVC_STANDALONE -O2 -I../Libs/dr_wav \
            Source/CLI_Standalone/main.cpp Source/DSP/VCPluginDSP.cpp \
            -o VC-PitchShift-CLI-Standalone -lm

      - name: Build VC-Reverb (Standalone, Gen2 FDN)
        shell: bash
        run: |
          cd VC-Reverb
          g++ -std=c++17 -DVC_STANDALONE -O2 -I../Libs/dr_wav \
            Source/CLI_Standalone/main.cpp Source/DSP/VCPluginDSP.cpp \
            -o VC-Reverb-CLI-Standalone -lm

      - name: Build VC-Comp (Standalone, Gen2 Multi-band)
        shell: bash
        run: |
          cd VC-Comp
          g++ -std=c++17 -DVC_STANDALONE -O2 -I../Libs/dr_wav \
            Source/CLI_Standalone/main.cpp Source/DSP/VCCompDSP.cpp \
            -o VC-Comp-CLI-Standalone -lm

      - name: Build VC-Tune (Standalone)
        shell: bash
        run: |
          cd VC-Tune
          g++ -std=c++17 -DVC_STANDALONE -O2 -I../Libs/dr_wav \
            Source/CLI_Standalone/main.cpp Source/DSP/VCPluginDSP.cpp \
            -o VC-Tune-CLI-Standalone -lm

      - name: Build VC-MultiBand (Standalone)
        shell: bash
        run: |
          cd VC-MultiBand
          g++ -std=c++17 -DVC_STANDALONE -O2 -I../Libs/dr_wav \
            Source/CLI_Standalone/main.cpp Source/DSP/VCPluginDSP.cpp \
            -o VC-MultiBand-CLI-Standalone -lm

      - name: Build VC-Harmonizer (Standalone)
        shell: bash
        run: |
          cd VC-Harmonizer
          g++ -std=c++17 -DVC_STANDALONE -O2 -I../Libs/dr_wav \
            Source/CLI_Standalone/main.cpp Source/DSP/VCPluginDSP.cpp \
            -o VC-Harmonizer-CLI-Standalone -lm

      - name: Build VC-NoiseProfile (Standalone)
        shell: bash
        run: |
          cd VC-NoiseProfile
          g++ -std=c++17 -DVC_STANDALONE -O2 -I../Libs/dr_wav \
            Source/CLI_Standalone/main.cpp Source/DSP/VCPluginDSP.cpp \
            -o VC-NoiseProfile-CLI-Standalone -lm

  # ──────────────────────────────────────
  # 阶段2: 每个插件 × 每个平台独立构建
  # ──────────────────────────────────────
  build:
    name: ${{ matrix.plugin }} (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.matrix).plugin }}
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            cmake_generator: "Ninja"
            macos_arch: universal
          - os: windows-latest
            cmake_generator: "Ninja"
          - os: ubuntu-latest
            cmake_generator: "Ninja"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'MacOS'
        shell: bash
        run: brew install ninja

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libdbus-1-dev pkg-config

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ runner.os }}-v${{ env.JUCE_VERSION }}

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git

      - name: Configure ${{ matrix.plugin }}
        shell: bash
        run: |
          mkdir -p ${{ matrix.plugin }}/build
          cd ${{ matrix.plugin }}/build
          cmake -G Ninja -DJUCE_PATH=../../JUCE -DCMAKE_BUILD_TYPE=Release \
            ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"' || '' }} \
            ..

      - name: Build ${{ matrix.plugin }}
        shell: bash
        run: |
          cd ${{ matrix.plugin }}/build
          cmake --build . --config Release

      - name: List artefacts
        if: always()
        shell: bash
        run: find ${{ matrix.plugin }}/build \( -name "*.vst3" -o -name "*.component" -o -name "*.dll" \) 2>/dev/null || echo "none found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.plugin }}-${{ matrix.os }}
          path: |
            ${{ matrix.plugin }}/build/${{ matrix.plugin }}_artefacts/
            ${{ matrix.plugin }}/build/**/${{ matrix.plugin }}.vst3/
          retention-days: 30

  # ──────────────────────────────────────
  # 阶段2.5: 三层CLI测试（仅在Linux上运行）
  # ──────────────────────────────────────
  test:
    name: Test ${{ matrix.plugin }} (3-Tier CLI)
    needs: [detect, gen2-verify, build]
    if: needs.detect.outputs.should_build == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.matrix).plugin }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libdbus-1-dev pkg-config sox
          pip install numpy scipy

      - name: Build Standalone CLI (g++, no JUCE)
        shell: bash
        run: |
          cd ${{ matrix.plugin }}
          if [ -f "Source/DSP/VCEQDSP.cpp" ]; then DSP="Source/DSP/VCEQDSP.cpp"
          elif [ -f "Source/DSP/VCCompDSP.cpp" ]; then DSP="Source/DSP/VCCompDSP.cpp"
          elif [ -f "Source/DSP/VCSmoothDSP.cpp" ]; then DSP="Source/DSP/VCSmoothDSP.cpp"
          elif [ -f "Source/DSP/VCDistortionDSP.cpp" ]; then DSP="Source/DSP/VCDistortionDSP.cpp"
          elif [ -f "Source/DSP/VCNoiseDSP.cpp" ]; then DSP="Source/DSP/VCNoiseDSP.cpp"
          elif [ -f "Source/DSP/VCSurgicalDeEsserDSP.cpp" ]; then DSP="Source/DSP/VCSurgicalDeEsserDSP.cpp"
          else DSP="Source/DSP/VCPluginDSP.cpp"; fi
          echo "DSP file: $DSP"
          g++ -std=c++17 -DVC_STANDALONE -O2 \
            -I../Libs/dr_wav \
            Source/CLI_Standalone/main.cpp $DSP \
            -o standalone-CLI -lm

      - name: "Tier 2+3: Functional & Effect Tests"
        shell: bash
        run: |
          python3 tests/cli_functional_test.py ${{ matrix.plugin }} ./${{ matrix.plugin }}/standalone-CLI

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ runner.os }}-v${{ env.JUCE_VERSION }}

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git

      - name: Build JUCE CLI
        shell: bash
        run: |
          mkdir -p ${{ matrix.plugin }}/build
          cd ${{ matrix.plugin }}/build
          cmake .. -G Ninja -DJUCE_PATH=../../JUCE -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: "Tier 1: Runnable Test (JUCE CLI)"
        shell: bash
        run: |
          sox -n test_input.wav synth 3 sine 440 vol 0.5 channels 2
          
          test_cli() {
            local cli_bin=$1
            local label=$2
            echo "=== Testing $label ==="
            # Synth plugins (VC-Drum) take only output.wav, no input
            if [ "${{ matrix.plugin }}" = "VC-Drum" ]; then
              $cli_bin test_output_${label}.wav --preset basic-beat --bars 1 || {
                echo "$label execution failed"
                return 1
              }
            else
              $cli_bin test_input.wav test_output_${label}.wav || {
                echo "$label execution failed"
                return 1
              }
            fi
            if [ ! -f "test_output_${label}.wav" ]; then
              echo "$label: Output file not created"
              return 1
            fi
            OUTPUT_SIZE=$(stat -c%s test_output_${label}.wav 2>/dev/null || echo 0)
            if [ "$OUTPUT_SIZE" -lt 1000 ]; then
              echo "$label: Output file too small: $OUTPUT_SIZE bytes"
              return 1
            fi
            soxi test_output_${label}.wav || {
              echo "$label: Output is not a valid WAV"
              return 1
            }
            echo "$label test passed!"
            return 0
          }
          
          STANDALONE_BIN=$(find ${{ matrix.plugin }}/build -name "${{ matrix.plugin }}-CLI-Standalone" -type f 2>/dev/null | head -1)
          JUCE_BIN=$(find ${{ matrix.plugin }}/build -name "${{ matrix.plugin }}-CLI" -type f 2>/dev/null | head -1)
          
          if [ -z "$STANDALONE_BIN" ] && [ -z "$JUCE_BIN" ]; then
            echo "No JUCE CLI binary found for ${{ matrix.plugin }}, skipping JUCE CLI test"
            exit 0
          fi
          
          PASSED=0
          FAILED=0
          
          if [ -n "$STANDALONE_BIN" ]; then
            if test_cli "$STANDALONE_BIN" "juce-standalone"; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          fi
          
          if [ -n "$JUCE_BIN" ]; then
            if test_cli "$JUCE_BIN" "juce"; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          fi
          
          echo "=== JUCE CLI Test Summary: $PASSED passed, $FAILED failed ==="
          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
  # ──────────────────────────────────────
  # 阶段3: 汇总打包 + 发Release
  # ──────────────────────────────────────
  release:
    name: Package & Release
    needs: [detect, gen2-verify, build, test]
    if: needs.detect.outputs.should_build == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package by platform
        shell: bash
        run: |
          mkdir -p release
          mkdir -p macos-universal-pkg
          for dir in artifacts/*-macos-latest; do
            [ -d "$dir" ] || continue
            find "$dir" \( -name "*.vst3" -o -name "*.component" \) -exec cp -r {} macos-universal-pkg/ \;
          done
          if ls macos-universal-pkg/*.vst3 2>/dev/null || ls macos-universal-pkg/*.component 2>/dev/null; then
            cd macos-universal-pkg && zip -r ../release/VocalChain-macOS-Universal.zip . && cd ..
          fi
          mkdir -p windows-pkg
          for dir in artifacts/*-windows-latest; do
            [ -d "$dir" ] || continue
            find "$dir" -name "*.vst3" -exec cp -r {} windows-pkg/ \;
          done
          if ls windows-pkg/*.vst3 2>/dev/null; then
            cd windows-pkg && zip -r ../release/VocalChain-Windows.zip . && cd ..
          fi
          mkdir -p linux-pkg
          for dir in artifacts/*-ubuntu-latest; do
            [ -d "$dir" ] || continue
            find "$dir" -name "*.vst3" -exec cp -r {} linux-pkg/ \;
          done
          if ls linux-pkg/*.vst3 2>/dev/null; then
            cd linux-pkg && zip -r ../release/VocalChain-Linux.zip . && cd ..
          fi
          echo "=== Packages ==="
          ls -lh release/

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.publish_release }}"
          gh release create "$TAG" release/*.zip \
            --repo "${{ github.repository }}" \
            --title "VocalChain $TAG" \
            --notes "VocalChain plugin suite $TAG

          ## Downloads
          - **VocalChain-macOS-Universal.zip** - All VST3 plugins for macOS (Universal, 10.15+)
          - **VocalChain-Windows.zip** - All VST3 plugins for Windows
          - **VocalChain-Linux.zip** - All VST3 plugins for Linux

          Built with JUCE ${{ env.JUCE_VERSION }}"
