name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Test all plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype6-dev libx11-dev libxrandr-dev libgl1-mesa-dev
      - name: Build all CLI standalones
        run: |
          for dir in VC-*/; do
            plugin=$(basename "$dir")
            if [ "$plugin" = "VC-Plugin-Template" ]; then continue; fi
            echo "=== Building $plugin ==="
            if [ -f "${dir}Source/DSP/VCEQDSP.cpp" ]; then
              DSP="VCEQDSP"
            elif [ -f "${dir}Source/DSP/VCCompDSP.cpp" ]; then
              DSP="VCCompDSP"
            elif [ -f "${dir}Source/DSP/VCSmoothDSP.cpp" ]; then
              DSP="VCSmoothDSP"
            elif [ -f "${dir}Source/DSP/VCDistortionDSP.cpp" ]; then
              DSP="VCDistortionDSP"
            elif [ -f "${dir}Source/DSP/VCNoiseDSP.cpp" ]; then
              DSP="VCNoiseDSP"
            elif [ -f "${dir}Source/DSP/VCSurgicalDeEsserDSP.cpp" ]; then
              DSP="VCSurgicalDeEsserDSP"
            else
              DSP="VCPluginDSP"
            fi
            cd "$dir"
            g++ -std=c++17 -DVC_STANDALONE -O2 -I../Libs/dr_wav \
              Source/CLI_Standalone/main.cpp Source/DSP/${DSP}.cpp \
              -o ${plugin}-CLI-Standalone -lm
            cd ..
          done
      - name: Test CLI binaries
        run: |
          for bin in VC-*-CLI-Standalone; do
            plugin=$(echo "$bin" | sed 's/-CLI-Standalone//')
            if [ "$plugin" = "VC-Plugin-Template" ]; then continue; fi
            echo "=== Testing $bin ==="
            ./$bin --help || true
          done

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Generate changelog from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Extract the section for this version from CHANGELOG.md
          # Get everything between "## [VERSION]" and the next "## [" section
          python3 -c "
          import re, sys
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          version = '${{ steps.version.outputs.VERSION }}'
          # Match the version section (with or without brackets)
          pattern = r'## \[' + re.escape(version.lstrip('v')) + r'\].*?(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              section = match.group(0).strip()
              print(section)
          else:
              print(f'No changelog section found for {version}')
              # Fallback: use commit log
              import subprocess
              result = subprocess.run(['git', 'log', '--pretty=format:- %s (%h)', '--reverse'], capture_output=True, text=True)
              print(result.stdout)
          " > /tmp/changelog.txt
          cat /tmp/changelog.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AudioFX ${{ steps.version.outputs.VERSION }} — VC-Arp Arpeggiator"
          body_path: /tmp/changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
